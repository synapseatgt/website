# Opens monthly pull requests to update dependencies. Merge them if the build passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      everything-else:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
