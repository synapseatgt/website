# Opens monthly pull requests to update dependencies. Merge them if the build passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      everything-else:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check doesn't support TypeScript 7 yet. Remove once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
